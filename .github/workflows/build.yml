name: Build ksmbd with SMB1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd curl

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt76x8/"
          SDK_FILE=$(curl -s "$BASE" | grep -oE 'openwrt-sdk-[^"]+\.tar\.(zst|xz)' | head -1)
          echo "Found SDK: $SDK_FILE"
          wget "$BASE$SDK_FILE"
          mkdir sdk
          case "$SDK_FILE" in
            *.zst) tar --use-compress-program=unzstd -xf "$SDK_FILE" -C sdk --strip-components=1 ;;
            *.xz)  tar -xJf "$SDK_FILE" -C sdk --strip-components=1 ;;
          esac

      - name: Update and install feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install ksmbd-tools

      - name: Force-enable SMB1 support
        working-directory: sdk
        run: |
          MKFILE=$(find feeds/packages/net/ksmbd-tools -name Makefile)
          echo "--- Original relevant lines ---"
          grep -n "INSECURE\|PKG_EXTRA_KCONFIG\|SMB_SERVER=m" "$MKFILE" || true
          if grep -q "KSMBD_SMB_INSECURE_SERVER" "$MKFILE"; then
            echo "Option found — will select it via .config"
          else
            echo "Option missing in this feed revision — patching Makefile directly"
            sed -i 's/CONFIG_SMB_SERVER=m \\/CONFIG_SMB_SERVER=m CONFIG_SMB_INSECURE_SERVER=y \\/' "$MKFILE"
          fi

      - name: Configure build
        working-directory: sdk
        run: |
          make defconfig
          echo "CONFIG_PACKAGE_kmod-fs-ksmbd=y" >> .config
          echo "CONFIG_PACKAGE_ksmbd-server=y" >> .config
          echo "CONFIG_KSMBD_SMB_INSECURE_SERVER=y" >> .config
          make defconfig

      - name: Build ksmbd package
        working-directory: sdk
        run: make package/feeds/packages/ksmbd-tools/{clean,compile} V=s -j$(nproc)

      - name: Collect output packages
        run: |
          mkdir -p out
          find sdk/bin -iname "*ksmbd*" -exec cp {} out/ \; -print

      - uses: actions/upload-artifact@v4
        with:
          name: ksmbd-smb1-packages
          path: out/
