name: Build OpenWrt 19.07.10 image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

      - name: Download ImageBuilder
        run: |
          wget https://downloads.openwrt.org/releases/19.07.10/targets/ramips/mt76x8/openwrt-imagebuilder-19.07.10-ramips-mt76x8.Linux-x86_64.tar.xz
          tar xf openwrt-imagebuilder-19.07.10-ramips-mt76x8.Linux-x86_64.tar.xz
          mv openwrt-imagebuilder-19.07.10-ramips-mt76x8.Linux-x86_64 ib

      - name: Show profile name
        working-directory: ib
        run: make info | grep -i wr842 || make info | head -60

      - name: Build image
        working-directory: ib
        run: |
          make image PROFILE="tplink_tl-wr842n-v5" FORCE=1 \
            PACKAGES="luci luci-ssl samba36-server luci-app-samba block-mount kmod-fs-vfat kmod-fs-f2fs kmod-fs-exfat relayd miniupnpd luci-app-upnp wifischedule luci-app-wifischedule kmod-usb-net-rndis kmod-usb-net-cdc-ether kmod-mtd-rw -ppp -ppp-mod-pppoe -ppp-mod-pppol2tp -odhcp6c -odhcpd-ipv6only -kmod-fs-hfs -kmod-fs-hfsplus -kmod-fs-ext4"

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.10-tl-wr842n-v5
          path: ib/bin/targets/ramips/mt76x8/*
